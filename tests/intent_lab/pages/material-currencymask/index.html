<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><title>Material CurrencyMask Fixture</title></head>
<body>
  <h1>Material CurrencyMask</h1>
  <label for="valor_imovel">Valor do Imóvel</label>
  <input type="text" id="valor_imovel" placeholder="R$ 0,00" style="width:200px;display:block;">
  <label for="plain">Campo Simples</label>
  <input type="text" id="plain" placeholder="texto livre" style="width:200px;display:block;">
  <script>
  (function() {
    var el = document.getElementById('valor_imovel');
    var _digits = '';    // digits from keyboard input
    var _raw_set = '';   // last programmatic assignment

    function fmt(d) {
      var n = parseInt(d || '0', 10);
      var c = (n / 100).toFixed(2);
      var p = c.split('.');
      return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + p[1];
    }

    // Dynamic prototype setter lookup (picks up any hooks installed after page load)
    function _protoSet(v) {
      Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set.call(el, v);
    }

    el._tf_internal_raw = function() { return _digits; };
    el._tf_internal_display = function() { return _digits ? fmt(_digits) : _raw_set; };

    Object.defineProperty(el, 'value', {
      configurable: true, enumerable: true,
      // Getter: returns formatted keyboard input if any, else last programmatic value
      get: function() { return _digits ? fmt(_digits) : _raw_set; },
      // Setter: stores raw value, delegates to prototype (overlay hook fires)
      set: function(v) {
        _raw_set = String(v).trim();
        _protoSet(_raw_set);
      }
    });

    el.addEventListener('keydown', function(e) {
      if (e.key >= '0' && e.key <= '9') {
        e.preventDefault();
        _digits += e.key;
        _raw_set = '';   // keyboard takes over display
        _protoSet(fmt(_digits));
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        _digits = _digits.slice(0, -1);
        _raw_set = '';
        _protoSet(_digits ? fmt(_digits) : '');
      }
    });
  })();
  </script>
</body>
</html>
