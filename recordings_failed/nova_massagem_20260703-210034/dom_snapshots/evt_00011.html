<script type="text/javascript" language="javascript" src="plugins/jquery-3.6.0/jquery-3.6.0.min.js"></script>

<script type="text/javascript" language="javascript">
$(function(){
	$("#divLista").width(screen.width * 0.8);
	var varMargin = ((screen.width - $("main").width()) / 2) - ((screen.width - $("#divLista").width()) / 2);
	$("#divLista").css("margin-left", (varMargin * -1));

	$("#lstUf").change(function(){
		$("#lstEdificio").val(0);
		$("#lstData").val(0);
	});

	$("#lstEdificio").change(function(){
		$("#lstData").val(0);
	});

	$("#frmFiltro").change(function(){
		$(this).submit();
	});

	$(".btn-success").click(function(){
		$(".btn-success").removeClass("btn-success").addClass("btn-warning disabled").html("<div class='spinner-border spinner-border-sm' role='status'><span class='visually-hidden'>Loading...</span></div>");
		$("#hdnIdAgendamento").val(this.id);

		$("#mdlCaptcha").modal("show");

		$.ajax({
			type: "POST",
			url: "captcha_gerador.asp",
			dataType: "json",
			success: function(resposta){
				console.log("Resposta recebida:", resposta);

				if (resposta && resposta.src && resposta.nuIdCaptcha) {
					$("#hdnIdCaptcha").val(resposta.nuIdCaptcha);
					$("#imgCaptcha").attr("src", resposta.src);
				} else {
					console.error("Resposta incompleta ou malformada:", resposta);
				}
			},
			error: function(xhr, status, error) {
				console.error("Erro na requisição AJAX:", status, error);
			}
		});
	});

	$("#btnPlay").click(function(){
		var varIdCaptcha = $("#hdnIdCaptcha").val();

		$.ajax({
			url: "captcha_audio.asp",
			data: {id_captcha: varIdCaptcha}
		}).done(function(palavra){
			var utterance = new SpeechSynthesisUtterance(palavra);
			utterance.lang = "pt-BR";
			speechSynthesis.speak(utterance);
		});
	});

	$("#btnValidaCaptcha").click(function(){
		var varIdCaptcha = $("#hdnIdCaptcha").val();
		var varPalavraCaptcha = $("#txtCaptcha").val();

		$("#spnMensagem").html("");

		$.ajax({
			type: "POST",
			url: "captcha_validador.asp",
			data: {
				id_captcha: varIdCaptcha,
				palavra: varPalavraCaptcha
			}
		}).done(function(resposta){
			varResposta = resposta.split(";");
			if (varResposta[0] == "0") {
				$("#spnMensagem").html("Erro ao validar o captcha.<br />" + varResposta[1]).removeClass("captcha-sucesso").addClass("captcha-erro");
				$("#btnGravarAgendamento").addClass("disabled");
			} else {
				$("#spnMensagem").html("Captcha validado.").removeClass("captcha-erro").addClass("captcha-sucesso");
				$("#btnGravarAgendamento").removeClass("disabled");
			}
		});
	});

	$("#btnGravarAgendamento").click(function(){
		if (!$(this).hasClass("disabled")) {
			var varMatricula = "160698";
			var varData = "1899-12-30";
			var varUf = "GO";
			var varEdificio = 21;
			var varId = $("#hdnIdAgendamento").val().split("_");
			var varHorario = varId[1];
			var varTipoMassagem = varId[2];

			$.ajax({
				url: "checa_disponibilidade.asp",
				data: {
					dt_atendimento: varData,
					edificio: varEdificio,
					horario: varHorario,
					tipo_massagem: varTipoMassagem
				}
			}).done(function(retorno){
				if (retorno == 1) {
					alert("Infelizmente, o aparelho selecionado já foi reservado neste horário.\nTenta novamente em um horário ou aparelho diferente.")
					$.redirect("novo_agendamento.asp", {"lstData": varData, "lstEdificio": varEdificio, "lstUf": varUf})
				} else {
					$.ajax({
						url: "registra_agendamento.asp",
						data: {
							matricula: varMatricula,
							dt_atendimento: varData,
							edificio: varEdificio,
							horario: varHorario,
							tipo_massagem: varTipoMassagem
						}
					}).done(function(msg){
						alert(msg);
						$("#mdlCaptcha").modal("hide");
					});
				}
			});
		}
	});

	$("#mdlCaptcha").on("hidden.bs.modal", function(e){
		location.reload();
	});

	$(".btn-danger").click(function(){
		var confirma = confirm("Confirma a exclusão do agendamento?");

		if (confirma) {
			$(this).removeClass("btn-danger").addClass("btn-warning disabled").html("<div class='spinner-border spinner-border-sm' role='status'><span class='visually-hidden'>Loading...</span></div>");
			$(".btn-success").removeClass("btn-danger").addClass("btn-warning disabled").html("<div class='spinner-border spinner-border-sm' role='status'><span class='visually-hidden'>Loading...</span></div>");

			var varMatricula = "160698";
			var varData = "1899-12-30";
			var varEdificio = 21;
			var varId = this.id.split("_");
			var varHorario = varId[1];
			var varTipoMassagem = varId[2];
			
			$.ajax({
				url: "exclui_agendamento.asp",
				data: {
					matricula: varMatricula,
					dt_atendimento: varData,
					edificio: varEdificio,
					horario: varHorario,
					tipo_massagem: varTipoMassagem
				}
			}).done(function(msg){
				alert(msg);
				location.reload();
			});
		}
	});
});
</script>
